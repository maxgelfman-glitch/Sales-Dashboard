function runImport(){
  var ov=document.getElementById('overlay');
  var map={};
  ov.querySelectorAll('[data-map]').forEach(function(s){ map[s.dataset.map]=s.value; });
  var type=document.getElementById('imp-type').value;
  var dedupe=document.getElementById('imp-dedupe').checked;
  var headers=state._importHeaders, body=state._importRows;
  var firstIdx=-1,lastIdx=-1; var am=autoMap(headers); firstIdx=am._firstIdx; lastIdx=am._lastIdx;
  function val(r,key){ var m=map[key]; if(m===''||m==null) return ''; if(m==='__FL__'){ return ((r[firstIdx]||'')+' '+(r[lastIdx]||'')).trim(); } var idx=+m; return (r[idx]!=null?String(r[idx]):'').trim(); }
  if((map.name===''||map.name==null)){ toast('Pick which column is the name',true); return; }

  var existingKeys={};
  state.leads.forEach(function(l){ if(l.phone) existingKeys['p'+digits(l.phone).slice(-10)]=1; if(l.email) existingKeys['e'+l.email.toLowerCase()]=1; });
  var added=0,skipped=0,seen={};
  body.forEach(function(r){
    var name=val(r,'name'); if(!name) { skipped++; return; }
    var phone=val(r,'phone'),email=val(r,'email');
    var pk=phone?'p'+digits(phone).slice(-10):'', ek=email?'e'+email.toLowerCase():'';
    if(dedupe){ if((pk&&(existingKeys[pk]||seen[pk]))||(ek&&(existingKeys[ek]||seen[ek]))){ skipped++; return; } }
    if(pk) seen[pk]=1; if(ek) seen[ek]=1;
    var valNum=val(r,'value').replace(/[^0-9.]/g,'');
    var lead={id:uid(),type:type,name:name,contact:val(r,'contact'),phone:phone,email:email,address:val(r,'address'),value:valNum,source:val(r,'source')||'Other',stage:'new',confidence:'warm',notes:val(r,'notes'),services:[],comms:[],followUp:null,reclean:0,created:Date.now(),updated:Date.now()};
    state.leads.push(lead); added++;
  });
  save(); state._importRows=null; state._importHeaders=null; closeModal(); render();
  toast('Imported '+added+' lead'+(added===1?'':'s')+(skipped?' · '+skipped+' skipped':''));
}

/* ---------- Sample & erase ---------- */
function clearSamples(){
  openModal(confirmModal('Clear sample leads?','This removes the '+state.leads.filter(function(l){return l.sample;}).length+' example leads so you can start with your own. Your own leads (if any) stay.','Clear samples',function(){ state.leads=state.leads.filter(function(l){return !l.sample;}); save(); closeOverlay(); render(); toast('Samples cleared'); },false));
}
function saveTemplate(id){
  var name=document.getElementById('te-name').value.trim(), body=document.getElementById('te-body').value.trim();
  if(!name){ toast('Give it a name',true); return; }
  if(!body){ toast('Write a message',true); return; }
  settings.templates=settings.templates||[];
  if(id){ var t=settings.templates.filter(function(x){return x.id===id;})[0]; if(t){ t.name=name; t.body=body; } }
  else { settings.templates.push({id:'tp'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:name,body:body}); }
  saveSettings(); openModal(settingsModal()); toast('Template saved');
}
function deleteCustomService(id){
  settings.customServices=(settings.customServices||[]).filter(function(s){return s.id!==id;});
  state.leads.forEach(function(l){ if(l.services) l.services=l.services.filter(function(s){return s!==id;}); });
  save(); saveSettings(); openModal(settingsModal()); toast('Tag removed');
}
function eraseAll(){
  openModal(confirmModal('Erase everything?','This permanently deletes ALL '+state.leads.length+' leads from this browser. Make sure you exported a backup first — this cannot be undone.','Erase all',function(){ state.leads=[]; save(); closeOverlay(); render(); toast('All data erased'); }));
}

/* ---------- Keyboard ---------- */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ if(state._modal) closeModal(); else if(state.selectedId) closeOverlay(); }
  var typing=/input|textarea|select/i.test(document.activeElement.tagName);
  if((e.key==='n'||e.key==='N')&&!typing&&!state._modal&&!state.selectedId){ e.preventDefault(); openModal(leadModal(null)); }
  if(e.key==='/'&&!typing){ e.preventDefault(); var s=document.getElementById('search'); if(s) s.focus(); }
});

/* ============================================================================ BOOT */
function boot(){
  loadSettings();
  try{ var th=localStorage.getItem(THEME_KEY); if(th) document.documentElement.setAttribute('data-theme',th); }catch(e){}
  var had=load();
  if(!had||state.leads.length===0){ seed(); }
  // normalize / migrate every record so no malformed lead can break rendering
  if(Array.isArray(state.leads)) state.leads=state.leads.map(normalizeLead); else state.leads=[];
  if(!settings.templates) settings.templates=[];
  if(!settings.customServices) settings.customServices=[];
  if(!settings.customSources) settings.customSources=[];
  if(!settings.customPropertyTypes) settings.customPropertyTypes=[];
  if(settings.autoCadence===undefined) settings.autoCadence=true;
  if(!settings.tone) settings.tone='friendly';
  render();
  checkReminders(false);
  setInterval(function(){ checkReminders(false); }, 60*60*1000);
}
boot();
