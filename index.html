<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PowerWash CRM</title>
<style>
/* ============================================================
   Design tokens — Apple-clean, cool neutral bias, blue accent
   ============================================================ */
:root{
  --bg:#f5f6f8;
  --surface:#ffffff;
  --surface-2:#fbfcfd;
  --surface-hover:#f2f4f7;
  --ink:#1d1d1f;
  --ink-2:#3a3a3c;
  --muted:#86868b;
  --faint:#aeb0b6;
  --line:#e6e8ec;
  --line-strong:#d7dae0;

  --accent:#0071e3;
  --accent-press:#0059b8;
  --accent-soft:#e8f1fe;

  --good:#1a9e4b;      /* won */
  --good-soft:#e4f6ea;
  --warn:#c97a00;      /* due soon */
  --warn-soft:#fdf0dc;
  --bad:#d70015;       /* overdue */
  --bad-soft:#fde7e7;

  --res:#0a8a7a;       /* residential */
  --res-soft:#dff4f0;
  --com:#5648c8;       /* commercial */
  --com-soft:#ebe9fb;

  --shadow-sm:0 1px 2px rgba(20,24,33,.06), 0 1px 1px rgba(20,24,33,.04);
  --shadow:0 4px 16px rgba(20,24,33,.08), 0 1px 3px rgba(20,24,33,.05);
  --shadow-lg:0 18px 50px rgba(20,24,33,.18), 0 6px 16px rgba(20,24,33,.08);

  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:22px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sidebar-w:236px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme:dark){
    --bg:#0b0b0d;
    --surface:#1a1a1e;
    --surface-2:#161619;
    --surface-hover:#25252b;
    --ink:#f5f5f7;
    --ink-2:#d0d0d4;
    --muted:#8e8e96;
    --faint:#6a6a72;
    --line:#2a2a30;
    --line-strong:#36363d;

    --accent:#3a9bff;
    --accent-press:#63b0ff;
    --accent-soft:#16283d;

    --good:#4cc96f; --good-soft:#12301d;
    --warn:#f0a838; --warn-soft:#33260f;
    --bad:#ff6b63; --bad-soft:#361618;
    --res:#3fbfab; --res-soft:#0f2b27;
    --com:#9a8ff2; --com-soft:#211d3a;

    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 6px 20px rgba(0,0,0,.5);
    --shadow-lg:0 20px 60px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0d;
  --surface:#1a1a1e;
  --surface-2:#161619;
  --surface-hover:#25252b;
  --ink:#f5f5f7;
  --ink-2:#d0d0d4;
  --muted:#8e8e96;
  --faint:#6a6a72;
  --line:#2a2a30;
  --line-strong:#36363d;
  --accent:#3a9bff;
  --accent-press:#63b0ff;
  --accent-soft:#16283d;
  --good:#4cc96f; --good-soft:#12301d;
  --warn:#f0a838; --warn-soft:#33260f;
  --bad:#ff6b63; --bad-soft:#361618;
  --res:#3fbfab; --res-soft:#0f2b27;
  --com:#9a8ff2; --com-soft:#211d3a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 6px 20px rgba(0,0,0,.5);
  --shadow-lg:0 20px 60px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;text-rendering:optimizedLegibility;
  font-size:15px;line-height:1.45;letter-spacing:-.01em;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:content-box}

/* ============================================================ Layout ============ */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;overflow:hidden}

.sidebar{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 14px;gap:6px;min-width:0;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.brand .mark{
  width:34px;height:34px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(150deg,#3aa0ff,#0071e3 55%,#0059b8);
  display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,113,227,.35);
}
.brand .mark svg{width:19px;height:19px}
.brand .name{font-weight:650;font-size:15.5px;letter-spacing:-.02em;line-height:1.1}
.brand .name small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.02em}

.nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;border:none;background:transparent;
  color:var(--ink-2);padding:9px 11px;border-radius:10px;font-size:14.5px;font-weight:500;
  text-align:left;transition:background .12s,color .12s;position:relative;
}
.nav button svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto;transition:color .12s}
.nav button:hover{background:var(--surface-hover)}
.nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button.active svg{color:var(--accent)}
.nav .badge{
  margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;
  min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px;letter-spacing:0;
}
.nav .badge.zero{display:none}

.side-spacer{flex:1 1 auto}
.side-foot{display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:12px}
.side-foot button{
  display:flex;align-items:center;gap:10px;border:none;background:transparent;color:var(--muted);
  padding:8px 11px;border-radius:9px;font-size:13px;font-weight:500;text-align:left;width:100%;
}
.side-foot button:hover{background:var(--surface-hover);color:var(--ink-2)}
.side-foot button svg{width:16px;height:16px;flex:0 0 auto}

/* ============================================================ Main ============ */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{
  display:flex;align-items:center;gap:14px;padding:14px 26px;
  border-bottom:1px solid var(--line);background:var(--surface);flex:0 0 auto;
}
.topbar h1{font-size:20px;font-weight:650;letter-spacing:-.025em;margin:0;flex:0 0 auto}

.seg{display:inline-flex;background:var(--surface-hover);border-radius:10px;padding:3px;gap:2px}
.seg button{
  border:none;background:transparent;color:var(--ink-2);font-weight:550;font-size:13px;
  padding:6px 14px;border-radius:8px;transition:.14s;display:flex;align-items:center;gap:7px;
}
.seg button .dot{width:7px;height:7px;border-radius:50%}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

.search{margin-left:auto;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;width:16px;height:16px;color:var(--faint);pointer-events:none}
.search input{
  border:1px solid var(--line);background:var(--surface-2);border-radius:10px;
  padding:8px 12px 8px 34px;width:230px;color:var(--ink);transition:.14s;
}
.search input:focus{outline:none;border-color:var(--accent);background:var(--surface);width:280px;box-shadow:0 0 0 3.5px var(--accent-soft)}
.search input::placeholder{color:var(--faint)}

.btn{
  border:none;border-radius:10px;font-weight:600;font-size:14px;padding:9px 15px;
  display:inline-flex;align-items:center;gap:7px;transition:.14s;white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(0,113,227,.28)}
.btn-primary:hover{background:var(--accent-press)}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{background:var(--surface-hover);color:var(--ink-2)}
.btn-ghost:hover{background:var(--line)}
.btn-soft{background:var(--accent-soft);color:var(--accent)}
.btn-soft:hover{filter:brightness(.97)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn-danger:hover{filter:brightness(.97)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn-sm svg{width:14px;height:14px}

.content{flex:1 1 auto;overflow-y:auto;padding:26px;scroll-behavior:smooth}

/* ============================================================ Banners ============ */
.banner{
  display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r);
  margin-bottom:18px;font-size:13.5px;
}
.banner svg{width:18px;height:18px;flex:0 0 auto}
.banner .b-txt{flex:1;min-width:0}
.banner .b-txt b{font-weight:650}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.info .b-txt{color:var(--ink-2)}
.banner.amber{background:var(--warn-soft);color:var(--warn)}
.banner.amber .b-txt{color:var(--ink-2)}
.banner .b-act{display:flex;gap:8px;flex:0 0 auto}

/* ============================================================ Chips & pills ======= */
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;
  padding:3px 9px;border-radius:20px;letter-spacing:.01em;white-space:nowrap;line-height:1.4;
}
.chip .dot{width:6px;height:6px;border-radius:50%}
.chip-res{background:var(--res-soft);color:var(--res)}
.chip-com{background:var(--com-soft);color:var(--com)}
.chip-good{background:var(--good-soft);color:var(--good)}
.chip-warn{background:var(--warn-soft);color:var(--warn)}
.chip-bad{background:var(--bad-soft);color:var(--bad)}
.chip-neutral{background:var(--surface-hover);color:var(--muted)}
.chip-svc{background:var(--surface-hover);color:var(--ink-2);font-weight:600}
.chip-repeat{background:var(--good-soft);color:var(--good)}

/* ============================================================ Dashboard ======= */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px 17px;box-shadow:var(--shadow-sm);
}
.stat .label{font-size:12.5px;color:var(--muted);font-weight:550;display:flex;align-items:center;gap:7px}
.stat .label svg{width:15px;height:15px}
.stat .value{font-size:29px;font-weight:680;letter-spacing:-.03em;margin-top:8px;line-height:1}
.stat .sub{font-size:12px;color:var(--faint);margin-top:5px}

.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);margin-bottom:20px;overflow:hidden;
}
.panel-head{display:flex;align-items:center;gap:10px;padding:15px 18px 13px}
.panel-head h2{font-size:16px;font-weight:650;letter-spacing:-.02em;margin:0}
.panel-head .count{font-size:12px;color:var(--muted);background:var(--surface-hover);padding:2px 9px;border-radius:20px;font-weight:600}
.panel-head .count.chip-bad{background:var(--bad-soft);color:var(--bad)}
.panel-head .count.chip-warn{background:var(--warn-soft);color:var(--warn)}
.panel-head .hint{margin-left:auto;font-size:12.5px;color:var(--faint)}

/* Follow-up rows */
.fu-row{display:flex;align-items:center;gap:13px;padding:12px 18px;border-top:1px solid var(--line);transition:background .12s}
.fu-row:hover{background:var(--surface-2)}
.fu-accent{width:3px;align-self:stretch;border-radius:3px;flex:0 0 auto;margin:-2px 0}
.fu-main{min-width:0;flex:1 1 auto;cursor:pointer}
.fu-name{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fu-meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.fu-meta b{color:var(--ink-2);font-weight:600}
.fu-when{flex:0 0 auto;text-align:right;font-size:12.5px;font-weight:650;min-width:88px}
.fu-when small{display:block;font-weight:500;color:var(--faint);font-size:11px}
.fu-actions{display:flex;gap:7px;flex:0 0 auto}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;color:var(--ink-2);transition:.12s;
}
.icon-btn:hover{background:var(--surface-hover);border-color:var(--line-strong)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.accent{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.icon-btn.snooze{color:var(--muted)}

/* ============================================================ Kanban ======= */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{
  flex:0 0 288px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);
  display:flex;flex-direction:column;max-height:calc(100vh - 165px);
}
.col.drop{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-soft)}
.col-head{display:flex;align-items:center;gap:9px;padding:13px 14px 10px;position:sticky;top:0}
.col-head .cdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.col-head h3{font-size:13.5px;font-weight:650;margin:0;letter-spacing:-.01em}
.col-head .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:650;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.col-body{padding:0 10px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;flex:1 1 auto;min-height:24px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;
  box-shadow:var(--shadow-sm);cursor:grab;transition:box-shadow .14s,transform .08s,border-color .14s;
}
.card:hover{box-shadow:var(--shadow);border-color:var(--line-strong)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.4}
.card-top{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.card-name{font-weight:625;font-size:14px;letter-spacing:-.01em;line-height:1.25}
.card-sub{font-size:12px;color:var(--muted);margin-top:2px}
.card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.card-val{font-size:12.5px;font-weight:650;color:var(--ink-2)}
.card-fu{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;margin-left:auto}
.card-fu svg{width:12px;height:12px}
.col-add{
  margin:2px 10px 12px;border:1px dashed var(--line-strong);background:transparent;color:var(--muted);
  border-radius:10px;padding:9px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;
}
.col-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.col-add svg{width:15px;height:15px}

/* ============================================================ Toolbar / filters ==== */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .t-lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.mini-sel{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:7px 11px;color:var(--ink);font-size:13px;font-weight:550}
.mini-sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.toolbar .count-txt{margin-left:auto;font-size:12.5px;color:var(--muted)}

/* ============================================================ Contacts table ==== */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
thead th{
  text-align:left;font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;
  padding:11px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;cursor:pointer;user-select:none;
}
thead th:hover{color:var(--ink-2)}
thead th .caret{opacity:.5;font-size:10px}
tbody td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
.td-name{font-weight:600}
.td-sub{font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
.dim{color:var(--muted)}

/* ============================================================ Insights ==== */
.ins-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.bars{padding:6px 18px 18px}
.bar-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.bar-row:first-child{border-top:none}
.bar-label{width:130px;flex:0 0 auto;font-size:13px;font-weight:550;display:flex;align-items:center;gap:7px;min-width:0}
.bar-label .sw{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.bar-track{flex:1;height:22px;background:var(--surface-hover);border-radius:6px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px;min-width:2px;transition:width .5s cubic-bezier(.3,1,.4,1)}
.bar-val{flex:0 0 auto;width:112px;text-align:right;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.bar-val small{color:var(--muted);font-weight:500}
.funnel{display:flex;gap:8px;padding:16px 18px 20px;flex-wrap:wrap}
.fn-step{flex:1;min-width:96px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.fn-step .fn-n{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1}
.fn-step .fn-l{font-size:12px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:6px}
.fn-step .fn-l .cdot{width:8px;height:8px;border-radius:50%}

/* ============================================================ Empty state ==== */
.empty{text-align:center;padding:64px 20px;color:var(--muted)}
.empty .ill{width:60px;height:60px;border-radius:16px;background:var(--surface-hover);display:grid;place-items:center;margin:0 auto 16px;color:var(--faint)}
.empty .ill svg{width:28px;height:28px}
.empty h3{color:var(--ink);font-size:17px;font-weight:650;margin:0 0 6px}
.empty p{margin:0 auto 18px;max-width:360px;font-size:14px}

/* ============================================================ Modal / Slideover ==== */
.scrim{position:fixed;inset:0;background:rgba(20,24,33,.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:40;opacity:0;animation:fade .18s forwards}
@keyframes fade{to{opacity:1}}
.modal{
  position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-46%);
  width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);
  opacity:0;animation:pop .2s cubic-bezier(.2,.9,.3,1.1) forwards;
}
.modal.wide{width:min(720px,calc(100vw - 32px))}
@keyframes pop{to{opacity:1;transform:translate(-50%,-50%)}}
.modal-head{display:flex;align-items:center;gap:10px;padding:20px 22px 4px}
.modal-head h2{font-size:19px;font-weight:680;letter-spacing:-.02em;margin:0}
.modal-head .x{margin-left:auto}
.modal-sub{padding:2px 22px 0;font-size:13px;color:var(--muted)}
.modal-body{padding:16px 22px 22px}
.modal-foot{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.modal-foot .spacer{flex:1}

.slideover{
  position:fixed;z-index:50;top:0;right:0;height:100vh;width:min(500px,100vw);
  background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;transform:translateX(100%);animation:slidein .26s cubic-bezier(.22,.9,.28,1) forwards;
}
@keyframes slidein{to{transform:translateX(0)}}
.so-head{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.so-top{display:flex;align-items:flex-start;gap:12px}
.so-title{font-size:21px;font-weight:700;letter-spacing:-.025em;line-height:1.15;margin:0}
.so-sub{font-size:13px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.so-body{flex:1;overflow-y:auto;padding:18px 22px 26px}
.so-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px}

.section{margin-bottom:22px}
.section-label{font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.section-label .add{margin-left:auto;color:var(--accent);font-weight:650;font-size:12px;background:none;border:none;padding:2px 4px;display:flex;align-items:center;gap:3px;text-transform:none;letter-spacing:0}
.section-label .add svg{width:13px;height:13px}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-item{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;align-items:center;gap:9px;min-width:0}
.info-item svg{width:16px;height:16px;color:var(--muted);flex:0 0 auto}
.info-item .it-txt{min-width:0;flex:1}
.info-item .it-lbl{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.info-item .it-val{font-size:13.5px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info-item a.it-val{color:var(--accent);text-decoration:none}
.info-item a.it-val:hover{text-decoration:underline}
.full{grid-column:1/-1}

.fu-set{border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px}
.fu-set.none{background:var(--surface-2);border:1px dashed var(--line-strong)}
.fu-set.ok{background:var(--accent-soft)}
.fu-set.warn{background:var(--warn-soft)}
.fu-set.bad{background:var(--bad-soft)}
.fu-set.good{background:var(--good-soft)}
.fu-set .fs-ic{width:34px;height:34px;border-radius:9px;background:var(--surface);display:grid;place-items:center;flex:0 0 auto;box-shadow:var(--shadow-sm)}
.fu-set .fs-ic svg{width:17px;height:17px}
.fu-set .fs-txt{flex:1;min-width:0}
.fu-set .fs-txt .t{font-weight:650;font-size:14px}
.fu-set .fs-txt .d{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.reclean-btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}

.timeline{display:flex;flex-direction:column;gap:0;position:relative}
.tl-item{display:flex;gap:13px;padding-bottom:16px;position:relative}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.tl-ic{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;z-index:1;border:2px solid var(--surface)}
.tl-ic svg{width:15px;height:15px}
.tl-call{background:var(--good-soft);color:var(--good)}
.tl-text{background:var(--accent-soft);color:var(--accent)}
.tl-email{background:var(--com-soft);color:var(--com)}
.tl-visit{background:var(--warn-soft);color:var(--warn)}
.tl-note{background:var(--surface-hover);color:var(--muted)}
.tl-body{flex:1;min-width:0;padding-top:1px}
.tl-top{display:flex;align-items:baseline;gap:8px}
.tl-method{font-weight:650;font-size:13.5px;text-transform:capitalize}
.tl-date{font-size:12px;color:var(--faint);margin-left:auto;white-space:nowrap}
.tl-notes{font-size:13.5px;color:var(--ink-2);margin-top:3px;white-space:pre-wrap;word-break:break-word}
.tl-del{opacity:0;color:var(--faint);background:none;border:none;font-size:11px;transition:.12s;padding:0}
.tl-actions{display:flex;gap:14px;margin-top:5px}
.tl-item:hover .tl-del{opacity:1}
.tl-del:hover{color:var(--accent)}
.tl-actions button[data-delcomm]:hover{color:var(--bad)}

.tpl{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px}
.tpl-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tpl-top .t{font-weight:600;font-size:13px}
.tpl-top .copy{margin-left:auto;font-size:11.5px;color:var(--accent);font-weight:650;background:none;border:none;display:flex;align-items:center;gap:4px}
.tpl-top .copy svg{width:12px;height:12px}
.tpl-txt{font-size:12.5px;color:var(--muted);line-height:1.5}

.notes-box{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;min-height:44px;line-height:1.5}
.notes-box.empty-note{color:var(--faint);font-style:italic}

/* Forms */
.field{margin-bottom:14px}
.field.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.field label,.field-lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field .req{color:var(--bad)}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;
  background:var(--surface-2);color:var(--ink);transition:.12s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3.5px var(--accent-soft)}
.field textarea{resize:vertical;min-height:76px;line-height:1.5}
.type-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-opt{border:1.5px solid var(--line-strong);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;background:var(--surface-2);transition:.12s;font-weight:600;font-size:14px;color:var(--ink)}
.type-opt svg{width:18px;height:18px}
.type-opt:hover{border-color:var(--faint)}
.type-opt.sel-res{border-color:var(--res);background:var(--res-soft);color:var(--res)}
.type-opt.sel-com{border-color:var(--com);background:var(--com-soft);color:var(--com)}
.method-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.method-opt{border:1.5px solid var(--line-strong);border-radius:11px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--surface-2);font-size:11.5px;font-weight:600;color:var(--ink-2);transition:.12s}
.method-opt svg{width:17px;height:17px}
.method-opt:hover{border-color:var(--faint)}
.method-opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tag-pick{display:flex;flex-wrap:wrap;gap:7px}
.tag-opt{border:1.5px solid var(--line-strong);background:var(--surface-2);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2);transition:.12s}
.tag-opt:hover{border-color:var(--faint)}
.tag-opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* Switch */
.switch{position:relative;display:inline-block;width:40px;height:24px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;background:var(--line-strong);border-radius:20px;transition:.18s}
.switch .track::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked + .track{background:var(--good)}
.switch input:checked + .track::before{transform:translateX(16px)}
.set-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:none}
.set-row .sr-txt{flex:1;min-width:0}
.set-row .sr-txt .t{font-weight:600;font-size:14px}
.set-row .sr-txt .d{font-size:12.5px;color:var(--muted);margin-top:2px}

/* CSV mapping */
.map-row{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.map-row:first-child{border-top:none}
.map-row .mr-lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.map-row .mr-lbl small{display:block;font-weight:500;color:var(--faint);font-size:11px}
.map-note{background:var(--accent-soft);color:var(--ink-2);border-radius:10px;padding:11px 13px;font-size:12.5px;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start}
.map-note svg{width:16px;height:16px;color:var(--accent);flex:0 0 auto;margin-top:1px}

/* Lead quality */
.conf-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.conf-opt{border:1.5px solid var(--line-strong);border-radius:11px;padding:10px 4px;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--surface-2);font-size:12.5px;font-weight:650;color:var(--ink-2);transition:.12s}
.conf-opt .cdot{width:10px;height:10px;border-radius:50%}
.conf-opt:hover{border-color:var(--faint)}
.conf-opt.sel-hot{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.conf-opt.sel-warm{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.conf-opt.sel-cold{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip-hot{background:var(--bad-soft);color:var(--bad)}
.chip-warm{background:var(--warn-soft);color:var(--warn)}
.chip-cold{background:var(--accent-soft);color:var(--accent)}
.qdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto;vertical-align:middle}

/* Compose / templates */
.send-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tpl-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.tpl-list .tpl{cursor:pointer;transition:.12s}
.tpl-list .tpl:hover{border-color:var(--line-strong)}
.tpl-list .tpl.sel{border-color:var(--accent);background:var(--accent-soft)}
.var-hint{font-size:11.5px;color:var(--muted);margin-top:7px}
.var-hint code{background:var(--surface-hover);padding:1px 5px;border-radius:5px;font-size:11px;color:var(--ink-2)}

/* Inline new-tag + management */
.new-tag{border-style:dashed!important;color:var(--muted)}
.new-tag:hover{border-color:var(--accent)!important;color:var(--accent)}
.mini-input{border:1.5px solid var(--accent);border-radius:20px;padding:6px 12px;font-size:12.5px;background:var(--surface);color:var(--ink);width:140px;outline:none}
.chip-manage{display:flex;flex-wrap:wrap;gap:7px}
.chip-manage .chip{padding:5px 10px}
.chip-manage .chip button{background:none;border:none;color:currentColor;opacity:.55;cursor:pointer;padding:0 0 0 3px;display:inline-flex;align-items:center}
.chip-manage .chip button:hover{opacity:1}
.chip-manage .chip button svg{width:12px;height:12px}
.tmpl-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.tmpl-item:first-child{border-top:none}
.tmpl-item .ti-txt{flex:1;min-width:0}
.tmpl-item .ti-txt .t{font-weight:600;font-size:13.5px}
.tmpl-item .ti-txt .d{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.tmpl-item .ti-act{display:flex;gap:6px;flex:0 0 auto}
.tone-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.tone-opt{border:1.5px solid var(--line-strong);border-radius:10px;padding:9px;text-align:center;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2);transition:.12s}
.tone-opt:hover{border-color:var(--faint)}
.tone-opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.settings-scroll{max-height:none}
.set-section-title{font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:20px 0 4px;padding-top:16px;border-top:1px solid var(--line)}
.set-section-title:first-child{border-top:none;padding-top:0;margin-top:0}

/* Toast */
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:11px;font-size:13.5px;font-weight:550;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;animation:toastin .22s cubic-bezier(.2,.9,.3,1.1);
}
.toast svg{width:16px;height:16px;color:var(--good)}
.toast .undo{background:transparent;border:none;color:var(--accent);font-weight:700;font-size:13.5px;padding:0 0 0 6px;cursor:pointer}
:root[data-theme="dark"] .toast .undo,:root:not([data-theme="light"]) .toast .undo{color:var(--accent)}
@keyframes toastin{from{opacity:0;transform:translateY(12px)}}

/* Mobile */
.menu-btn{display:none}
@media(max-width:880px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:60;left:0;top:0;height:100vh;width:250px;transform:translateX(-100%);transition:transform .24s;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:grid}
  .stats,.ins-grid{grid-template-columns:1fr 1fr}
  .search input{width:140px}
  .search input:focus{width:170px}
  .topbar h1{display:none}
  .info-grid{grid-template-columns:1fr}
  .content{padding:18px 14px}
  .topbar{padding:12px 14px;gap:10px}
}
@media(max-width:560px){
  .stats,.ins-grid{grid-template-columns:1fr 1fr;gap:10px}
  .seg button{padding:6px 10px}
  .seg button span{display:none}
  .field.row2{grid-template-columns:1fr}
  .bar-label{width:96px}
  .bar-val{width:80px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.05s!important;scroll-behavior:auto!important}}
</style>

function uid(){ return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function pad(n){ return n<10?'0'+n:''+n; }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDaysISO(n){ var d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addMonthsISO(n){ var d=new Date(); d.setMonth(d.getMonth()+n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function attr(s){ return esc(s); }
function money(n){ n=Number(n)||0; return '$'+n.toLocaleString('en-US'); }
function parseDate(iso){ if(!iso) return null; var p=String(iso).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function startOfToday(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function daysBetween(iso){ var d=parseDate(iso); if(!d||isNaN(d)) return null; return Math.round((d-startOfToday())/86400000); }
function relDays(iso){ var n=daysBetween(iso); if(n===null) return ''; if(n===0)return 'Today'; if(n===1)return 'Tomorrow'; if(n===-1)return 'Yesterday'; if(n<0)return Math.abs(n)+' days ago'; return 'in '+n+' days'; }
function fmtDate(iso){ var d=parseDate(iso); if(!d||isNaN(d)) return '—'; return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:d.getFullYear()!==new Date().getFullYear()?'numeric':undefined}); }
function isoFromTs(ts){ if(!ts) return todayISO(); var d=new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function lastContact(lead){ if(!lead.comms||!lead.comms.length) return null; return lead.comms.slice().sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:(b.ts||0)-(a.ts||0));})[0]; }
function fuStatus(lead){
  if(!lead.followUp||!lead.followUp.date) return {level:'none'};
  var n=daysBetween(lead.followUp.date);
  if(n===null) return {level:'none'};
  if(n<0) return {level:'overdue',days:n};
  if(n===0) return {level:'today',days:0};
  if(n<=7) return {level:'soon',days:n};
  return {level:'later',days:n};
}

/* ============================================================================
   SMART FOLLOW-UP CADENCE ENGINE
   Suggests the next follow-up (date + channel + why) from:
   situation(stage) × last outcome × attempt# × type(res/com) × channel history.
   All intelligence lives here; the UI just shows one editable suggestion.
   ============================================================================ */
var CADENCE = {
  residential: { new:[0], contacted:[1,2,4,7,14], estimate:[1], quoted:[2,5,10], job:[1] },
  commercial:  { new:[0], contacted:[3,7,14,30,60], estimate:[2], quoted:[3,7,21,42,30], job:[2] }
};
function commsByRecency(lead){ return (lead.comms||[]).slice().sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:((b.ts||0)-(a.ts||0))); }); }
function snapToSpring(iso){ var d=parseDate(iso); if(!d||isNaN(d)) return iso; var m=d.getMonth(),y=d.getFullYear(); if(m>=10) y+=1; if(m>=10||m<=1) return y+'-03-15'; return iso; }
function suggestChannel(lead, o, curMethod){
  var avail=[]; if(lead.phone){avail.push('call');avail.push('text');} if(lead.email) avail.push('email');
  if(!avail.length) return curMethod||'call';
  if(o && o.reset && avail.indexOf(curMethod)>=0) return curMethod;       // continue a live thread
  var comms=commsByRecency(lead), i;
  for(i=0;i<comms.length;i++){ var c=comms[i]; if(c.outcome && OUTCOME_MAP[c.outcome] && OUTCOME_MAP[c.outcome].reset && avail.indexOf(c.method)>=0 && c.method!==curMethod) return c.method; } // learned preference
  var order=(lead.type==='commercial'?['email','call','text']:['text','call','email']).filter(function(m){return avail.indexOf(m)>=0;});
  for(i=0;i<order.length;i++){ if(order[i]!==curMethod) return order[i]; }   // rotate off the channel just used
  return order[0]||avail[0];
}
function channelNote(channel, stage, o){
  var ch={call:'Call',text:'Text',email:'Email'}[channel]||'Reach out';
  var ang = o&&o.nurture?'seasonal check-in':(stage==='quoted'?'follow up on the quote':stage==='estimate'?'confirm the estimate appointment':stage==='job'?'confirm the job':stage==='contacted'?'follow up to book the estimate':'follow up');
  return ch+' — '+ang;
}
function suggestNextStep(lead, outcomeId, curMethod){
  var o=OUTCOME_MAP[outcomeId];
  if(!o){ // note / unspecified — gentle default, no attempt escalation
    var t0=lead.type==='commercial'?'commercial':'residential';
    var s0=(CADENCE[t0]||CADENCE.residential)[lead.stage]||CADENCE[t0].contacted;
    var ch0=suggestChannel(lead,null,curMethod);
    return {date:addDaysISO(s0[0]!=null?s0[0]:7), note:channelNote(ch0,lead.stage,null), why:'Follow up', channel:ch0, nurture:false};
  }
  if(o.lost) return null;                                   // going to Lost → no follow-up
  var type=lead.type==='commercial'?'commercial':'residential';
  var stage=o.stage||lead.stage;
  var seq=(CADENCE[type]||CADENCE.residential)[stage]||CADENCE[type].contacted;
  var days, why, nurture=false;
  if(o.nurture){ days=type==='commercial'?90:120; nurture=true; why='Not ready — nurturing for the season'; }
  else if(o.advance){
    var trailing=0, comms=commsByRecency(lead);
    for(var i=0;i<comms.length;i++){ if(comms[i].outcome==='noanswer'||comms[i].outcome==='voicemail') trailing++; else break; }
    if(trailing>=seq.length){ days=type==='commercial'?90:120; nurture=true; why=type==='commercial'?'Several attempts — long-term nurture':'No response after several tries — nurture or mark lost'; }
    else { days=seq[trailing]; var base=stage==='quoted'?'Quote is out':(stage==='contacted'?'Chasing the estimate':'Following up'); why=base+' · attempt '+(trailing+1)+' of '+seq.length; }
  } else { days=(seq[0]!=null?seq[0]:2); why=stage==='quoted'?'Quote sent — check in':stage==='estimate'?'Estimate booked — confirm':stage==='job'?'Job booked — confirm':'Keep the momentum'; }
  var date=addDaysISO(days); if(nurture||days>=75) date=snapToSpring(date);
  var channel=suggestChannel(lead,o,curMethod);
  return {date:date, note:channelNote(channel,stage,o), why:why, channel:channel, nurture:nurture};
}
function confOf(l){ return CONF_MAP[l.confidence]||CONF_MAP.warm; }
function resolveTemplate(lead,body){
  var first=(lead.contact||lead.name||'there').split(' ')[0];
  var place=lead.type==='commercial'?'property':'home';
  var svc=(lead.services&&lead.services.length)?svcName(lead.services[0]):place;
  return String(body)
    .replace(/\{first\}/g,first).replace(/\{name\}/g,lead.name||'')
    .replace(/\{business\}/g,lead.name||'').replace(/\{service\}/g,svc)
    .replace(/\{place\}/g,place).replace(/\{value\}/g,lead.value?money(lead.value):'the estimate');
}

function icsStamp(){ var d=new Date(); function p(n){return n<10?'0'+n:''+n;} return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+'T'+p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())+'Z'; }
function icsEscape(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function icsEvent(lead){
  var d=lead.followUp.date.replace(/-/g,''); // YYYYMMDD
  var start=d+'T090000', end=d+'T093000';

    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEscape('Follow up: '+lead.name),'TRIGGER:PT0S','END:VALARM',
    'END:VEVENT'].join('\r\n');
}

      '<button data-seg="commercial" class="'+(state.segment==='commercial'?'active':'')+'"><span class="dot" style="background:var(--com)"></span><span>Commercial</span></button>'+
    '</div>'+
    '<div class="search">'+I.search+'<input type="text" id="search" placeholder="Search leads…" value="'+attr(state.search)+'" aria-label="Search leads"/></div>'+
    '<button class="btn btn-primary" data-act="add">'+I.plus+'<span>Add Lead</span></button>'+
  '</div>';
}
function viewContent(){
  if(state.leads.length===0 && state.view!=='dashboard' && state.view!=='insights') return emptyAll();
  switch(state.view){
    case 'dashboard': return dashboardView();
    case 'pipeline':  return pipelineView();
    case 'followups': return followupsView();
    case 'contacts':  return contactsView();
    case 'insights':  return insightsView();
  }
  return '';
}
function emptyAll(){
  return banners()+'<div class="empty"><div class="ill">'+I.people+'</div>'+
    '<h3>No leads yet</h3><p>Add your first lead, or import your existing ones from Workiz, Go High Level, or a Facebook leads export.</p>'+
    '<div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-primary" data-act="add">'+I.plus+'Add a lead</button>'+
    '<button class="btn btn-ghost" data-act="add-import">'+I.upload+'Import from a file</button></div></div>';
}

/* ---------- Banners (sample data + backup nudge) ---------- */
function banners(){
  var out='';
  var hasSample=state.leads.some(function(l){return l.sample;});
  if(hasSample && !settings.sampleDismissed){
    out+='<div class="banner info">'+I.info+'<div class="b-txt"><b>These are sample leads</b> so you can see how everything works. Clear them whenever you\'re ready to add your own.</div>'+
      '<div class="b-act"><button class="btn btn-soft btn-sm" data-act="clear-sample">Clear samples</button><button class="icon-btn" data-act="dismiss-sample" title="Hide">'+I.x+'</button></div></div>';
  }
  var realCount=state.leads.filter(function(l){return !l.sample;}).length;
  if(realCount>0){
    var days = settings.lastBackup ? Math.floor((Date.now()-settings.lastBackup)/86400000) : 999;
    if(days>=14){
      out+='<div class="banner amber">'+I.download+'<div class="b-txt"><b>Back up your data.</b> Your leads live in this browser only — export a copy so you never lose them'+(settings.lastBackup?' (last backup '+days+' days ago)':'')+'.</div>'+
        '<div class="b-act"><button class="btn btn-ghost btn-sm" data-act="export">Export now</button></div></div>';
    }
  }
  return out;
}

/* ---------- Dashboard ---------- */
function dashboardView(){
  var v=visibleLeads();
  var active=v.filter(isActive), won=v.filter(function(l){return l.stage==='won';});
  var pipelineVal=active.reduce(function(s,l){return s+(Number(l.value)||0);},0);
  var overdue=v.filter(function(l){return fuStatus(l).level==='overdue';});
  var today=v.filter(function(l){return fuStatus(l).level==='today';});
  var soon=v.filter(function(l){return fuStatus(l).level==='soon';});

  var stats='<div class="stats">'+
    stat(I.people,'Active leads',active.length,segLabel()+' in pipeline')+
    stat(I.bell,'Need follow-up',overdue.length+today.length,overdue.length?overdue.length+' overdue':'You\'re all caught up')+
    stat(I.dollar,'Pipeline value',money(pipelineVal),'Potential open revenue')+
    stat(I.check,'Won',won.length,won.length?money(won.reduce(function(s,l){return s+(Number(l.value)||0);},0))+' booked':'No wins yet')+
  '</div>';

  var attention=overdue.concat(today).concat(soon);
  attention.sort(function(a,b){return daysBetween(a.followUp.date)-daysBetween(b.followUp.date);});
  var att = attention.length ? attention.map(fuRow).join('') :
    '<div class="empty" style="padding:40px 20px"><div class="ill" style="color:var(--good);background:var(--good-soft)">'+I.check+'</div>'+
    '<h3>Nothing needs chasing</h3><p>No overdue or upcoming follow-ups'+(state.segment==='all'?'':' for '+segLabel().toLowerCase())+'. Log a contact and set the next reach-out date to keep this list working for you.</p></div>';
  var attCls = overdue.length?'chip-bad':(today.length?'chip-warn':'');
  var attPanel='<div class="panel"><div class="panel-head"><h2>Needs your attention</h2><span class="count '+attCls+'">'+attention.length+'</span><span class="hint">Overdue &amp; due within 7 days</span></div>'+att+'</div>';

  var noFu=active.filter(function(l){return fuStatus(l).level==='none';});
  var noFuPanel='';
  if(noFu.length){
    noFu.sort(function(a,b){return (b.updated||0)-(a.updated||0);});
    noFuPanel='<div class="panel"><div class="panel-head"><h2>No follow-up scheduled</h2><span class="count">'+noFu.length+'</span><span class="hint">Active leads with no next step set</span></div>'+noFu.slice(0,6).map(fuRow).join('')+'</div>';
  }
  return banners()+stats+attPanel+noFuPanel;
}
function segLabel(){ return state.segment==='all'?'All types':(state.segment==='residential'?'Residential':'Commercial'); }
function stat(icon,label,value,sub){ return '<div class="stat"><div class="label">'+icon+label+'</div><div class="value tnum">'+value+'</div><div class="sub">'+esc(sub)+'</div></div>'; }

function fuRow(lead){
  var fu=fuStatus(lead), lc=lastContact(lead);
  var accent,whenColor,whenTxt;
  if(fu.level==='overdue'){accent='var(--bad)';whenColor='var(--bad)';whenTxt=Math.abs(fu.days)+'d overdue';}
  else if(fu.level==='today'){accent='var(--warn)';whenColor='var(--warn)';whenTxt='Due today';}
  else if(fu.level==='soon'){accent='var(--warn)';whenColor='var(--warn)';whenTxt='in '+fu.days+'d';}
  else if(fu.level==='later'){accent='var(--accent)';whenColor='var(--muted)';whenTxt=relDays(lead.followUp.date);}
  else {accent='var(--line-strong)';whenColor='var(--muted)';whenTxt='No date';}
  var typeChip='<span class="chip '+(lead.type==='residential'?'chip-res':'chip-com')+'"><span class="dot" style="background:currentColor"></span>'+(lead.type==='residential'?'Residential':'Commercial')+'</span>';
  var stageChip='<span class="chip chip-neutral">'+STAGE_MAP[lead.stage].name+'</span>';
  var lcTxt=lc?('Last: <b>'+METHOD_MAP[lc.method].name+'</b> · '+fmtDate(lc.date)):'Never contacted';
  var note=lead.followUp&&lead.followUp.note?' · '+esc(lead.followUp.note):'';
  var canSnooze=fu.level==='overdue'||fu.level==='today'||fu.level==='soon';
  return '<div class="fu-row">'+
    '<div class="fu-accent" style="background:'+accent+'"></div>'+
    '<div class="fu-main" data-open="'+lead.id+'">'+
      '<div class="fu-name">'+esc(lead.name)+' '+typeChip+' '+stageChip+(lead.reclean?' <span class="chip chip-repeat">'+I.repeat+'Repeat</span>':'')+'</div>'+
      '<div class="fu-meta"><span>'+lcTxt+'</span>'+(fu.level!=='none'?'<span>Follow up '+esc(fmtDate(lead.followUp.date))+note+'</span>':'')+'</div>'+
    '</div>'+
    '<div class="fu-when" style="color:'+whenColor+'">'+whenTxt+(fu.level!=='none'?'<small>'+esc(fmtDate(lead.followUp.date))+'</small>':'')+'</div>'+
    '<div class="fu-actions">'+
      (canSnooze?'<button class="icon-btn snooze" data-snooze="'+lead.id+'" title="Snooze 3 days">'+I.snooze+'</button>':'')+
      (lead.phone?'<a class="icon-btn" href="tel:'+attr(lead.phone)+'" title="Call">'+I.phone+'</a>':'')+
      '<button class="icon-btn accent" data-log="'+lead.id+'" title="Log contact">'+I.plus+'</button>'+
    '</div></div>';
}

/* ---------- Pipeline ---------- */
function pipelineView(){
  var v=visibleLeads();
  var cols=STAGES.map(function(s){
    var items=v.filter(function(l){return l.stage===s.id;}).sort(function(a,b){return (b.updated||0)-(a.updated||0);});
    var cards=items.map(kanbanCard).join('')||'<div style="padding:8px 4px;color:var(--faint);font-size:12.5px;text-align:center">Empty</div>';
    return '<div class="col" data-col="'+s.id+'"><div class="col-head"><span class="cdot" style="background:'+s.color+'"></span><h3>'+s.name+'</h3><span class="n tnum">'+items.length+'</span></div>'+
      '<div class="col-body" data-body="'+s.id+'">'+cards+'</div>'+
      '<button class="col-add" data-add-stage="'+s.id+'">'+I.plus+'Add lead</button></div>';
  }).join('');
  return '<div class="board" id="board">'+cols+'</div>';
}
function kanbanCard(lead){
  var fu=fuStatus(lead);
  var typeChip='<span class="chip '+(lead.type==='residential'?'chip-res':'chip-com')+'">'+(lead.type==='residential'?'Res':'Com')+'</span>';
  var fuBadge='';
  if(fu.level==='overdue')fuBadge='<span class="card-fu" style="color:var(--bad)">'+I.bell+Math.abs(fu.days)+'d late</span>';
  else if(fu.level==='today')fuBadge='<span class="card-fu" style="color:var(--warn)">'+I.bell+'Today</span>';
  else if(fu.level==='soon')fuBadge='<span class="card-fu" style="color:var(--warn)">'+I.clock+fu.days+'d</span>';
  else if(fu.level==='later')fuBadge='<span class="card-fu" style="color:var(--muted)">'+I.clock+relDays(lead.followUp.date)+'</span>';
  var tags=(lead.services||[]).slice(0,2).map(function(id){return '<span class="chip chip-svc">'+esc(svcName(id))+'</span>';}).join('');
  var more=(lead.services||[]).length>2?'<span class="chip chip-svc">+'+((lead.services.length)-2)+'</span>':'';
  var c=confOf(lead);
  var qdot='<span class="qdot" style="background:'+c.color+'" title="'+c.name+' lead"></span>';
  return '<div class="card" draggable="true" data-card="'+lead.id+'" data-open="'+lead.id+'">'+
    '<div class="card-top"><div><div class="card-name">'+qdot+' '+esc(lead.name)+'</div>'+(lead.contact?'<div class="card-sub">'+esc(lead.contact)+'</div>':'')+'</div>'+typeChip+'</div>'+
    (tags?'<div class="card-tags">'+tags+more+'</div>':'')+
    '<div class="card-foot">'+(lead.value?'<span class="card-val tnum">'+money(lead.value)+'</span>':'<span class="card-sub">No value</span>')+fuBadge+'</div></div>';
}

/* ---------- Follow-ups ---------- */
function followupsView(){
  var v=visibleLeads();
  var groups={overdue:[],today:[],soon:[],later:[],none:[]};
  v.forEach(function(l){ if(!isActive(l)) return; groups[fuStatus(l).level].push(l); });
  function grp(key,title,cls){
    var arr=groups[key]; if(!arr.length) return '';
    arr.sort(function(a,b){var da=a.followUp&&a.followUp.date?daysBetween(a.followUp.date):9999,db=b.followUp&&b.followUp.date?daysBetween(b.followUp.date):9999;return da-db;});
    return '<div class="panel"><div class="panel-head"><h2>'+title+'</h2><span class="count '+(cls||'')+'">'+arr.length+'</span></div>'+arr.map(fuRow).join('')+'</div>';
  }
  var out=grp('overdue','Overdue','chip-bad')+grp('today','Due today','chip-warn')+grp('soon','Due this week','chip-warn')+grp('later','Upcoming')+grp('none','No follow-up set');
  if(!out) return banners()+'<div class="empty"><div class="ill" style="color:var(--good);background:var(--good-soft)">'+I.check+'</div><h3>All clear</h3><p>No active leads need a follow-up right now.</p></div>';
  return banners()+out;
}

/* ---------- Contacts ---------- */
function contactsView(){
  var v=visibleLeads().slice();
  if(state.serviceFilter!=='all') v=v.filter(function(l){return (l.services||[]).indexOf(state.serviceFilter)>=0;});
  if(state.confFilter&&state.confFilter!=='all') v=v.filter(function(l){return (l.confidence||'warm')===state.confFilter;});
  if(state.sourceFilter&&state.sourceFilter!=='all') v=v.filter(function(l){return (l.source||'Other')===state.sourceFilter;});
  if(state.stageFilter&&state.stageFilter!=='all') v=v.filter(function(l){return l.stage===state.stageFilter;});
  if(state.ptypeFilter&&state.ptypeFilter!=='all') v=v.filter(function(l){return (l.propertyType||'')===state.ptypeFilter;});
  var sk=state.sort.key,dir=state.sort.dir==='asc'?1:-1;
  v.sort(function(a,b){
    var x,y;
    if(sk==='name'){x=(a.name||'').toLowerCase();y=(b.name||'').toLowerCase();}
    else if(sk==='value'){x=Number(a.value)||0;y=Number(b.value)||0;}
    else if(sk==='stage'){x=STAGES.findIndex(function(s){return s.id===a.stage;});y=STAGES.findIndex(function(s){return s.id===b.stage;});}
    else if(sk==='followup'){x=a.followUp&&a.followUp.date?daysBetween(a.followUp.date):99999;y=b.followUp&&b.followUp.date?daysBetween(b.followUp.date):99999;}
    else if(sk==='lastcontact'){var la=lastContact(a),lb=lastContact(b);x=la?la.date:'';y=lb?lb.date:'';}
    else {x=a.updated||0;y=b.updated||0;}
    return x<y?-1*dir:x>y?1*dir:0;
  });
  function th(key,label){var active=state.sort.key===key;return '<th data-sort="'+key+'">'+label+(active?' <span class="caret">'+(state.sort.dir==='asc'?'▲':'▼')+'</span>':'')+'</th>';}
  var rows=v.map(function(l){
    var fu=fuStatus(l),lc=lastContact(l),fuChip;
    if(fu.level==='overdue')fuChip='<span class="chip chip-bad">'+Math.abs(fu.days)+'d overdue</span>';
    else if(fu.level==='today')fuChip='<span class="chip chip-warn">Today</span>';
    else if(fu.level==='soon')fuChip='<span class="chip chip-warn">'+fmtDate(l.followUp.date)+'</span>';
    else if(fu.level==='later')fuChip='<span class="chip chip-neutral">'+fmtDate(l.followUp.date)+'</span>';
    else fuChip='<span class="dim" style="font-size:12.5px">—</span>';
    var c=confOf(l);
    return '<tr data-open="'+l.id+'"><td><div class="td-name"><span class="qdot" style="background:'+c.color+'" title="'+c.name+' lead"></span> '+esc(l.name)+(l.reclean?' <span class="chip chip-repeat" style="vertical-align:middle">Repeat</span>':'')+'</div>'+(l.contact?'<div class="td-sub">'+esc(l.contact)+'</div>':'')+'</td>'+
      '<td><span class="chip '+(l.type==='residential'?'chip-res':'chip-com')+'">'+(l.type==='residential'?'Residential':'Commercial')+'</span></td>'+
      '<td><span class="chip chip-neutral">'+STAGE_MAP[l.stage].name+'</span></td>'+
      '<td class="tnum">'+(l.value?money(l.value):'<span class="dim">—</span>')+'</td>'+
      '<td class="dim tnum" style="font-size:13px">'+(lc?fmtDate(lc.date):'Never')+'</td><td>'+fuChip+'</td></tr>';
  }).join('');
  var svcOpts='<option value="all">All services</option>'+allServices().map(function(s){return '<option value="'+s.id+'"'+(state.serviceFilter===s.id?' selected':'')+'>'+esc(s.name)+'</option>';}).join('');
  var confOpts='<option value="all">All quality</option>'+CONFIDENCE.map(function(c){return '<option value="'+c.id+'"'+(state.confFilter===c.id?' selected':'')+'>'+c.name+'</option>';}).join('');
  var stageFOpts='<option value="all">All stages</option>'+STAGES.map(function(s){return '<option value="'+s.id+'"'+(state.stageFilter===s.id?' selected':'')+'>'+s.name+'</option>';}).join('');
  var srcSet={}; allSources().forEach(function(s){srcSet[s]=1;}); state.leads.forEach(function(l){ if(l.source) srcSet[l.source]=1; });
  var srcFOpts='<option value="all">All sources</option>'+Object.keys(srcSet).map(function(s){return '<option'+(state.sourceFilter===s?' selected':'')+'>'+esc(s)+'</option>';}).join('');
  var ptSet={}; allPropertyTypes().forEach(function(s){ptSet[s]=1;}); state.leads.forEach(function(l){ if(l.propertyType) ptSet[l.propertyType]=1; });
  var ptFOpts='<option value="all">All property types</option>'+Object.keys(ptSet).map(function(s){return '<option'+(state.ptypeFilter===s?' selected':'')+'>'+esc(s)+'</option>';}).join('');
  var reset=(state.confFilter!=='all'||state.serviceFilter!=='all'||state.sourceFilter!=='all'||state.stageFilter!=='all'||state.ptypeFilter!=='all')?'<button class="btn btn-ghost btn-sm" id="clrFilters">Clear filters</button>':'';
  var toolbar='<div class="toolbar"><span class="t-lbl">Filter:</span><select class="mini-sel" id="stageFilter">'+stageFOpts+'</select><select class="mini-sel" id="ptypeFilter">'+ptFOpts+'</select><select class="mini-sel" id="sourceFilter">'+srcFOpts+'</select><select class="mini-sel" id="confFilter">'+confOpts+'</select><select class="mini-sel" id="svcFilter">'+svcOpts+'</select>'+reset+'<span class="count-txt">'+v.length+' lead'+(v.length===1?'':'s')+'</span></div>';
  return banners()+toolbar+'<div class="table-wrap"><table><thead><tr>'+th('name','Lead')+th('type','Type')+th('stage','Stage')+th('value','Value')+th('lastcontact','Last contact')+th('followup','Next follow-up')+'</tr></thead><tbody>'+(rows||'<tr><td colspan="6" class="empty" style="padding:40px">No matching leads</td></tr>')+'</tbody></table></div>';
}

/* ---------- Insights ---------- */
function insightsView(){
  var v=visibleLeads();
  if(v.length===0) return '<div class="empty"><div class="ill">'+I.chart+'</div><h3>No data yet</h3><p>Add or import leads and your conversion rates, revenue, and best lead sources will show up here.</p></div>';
  var won=v.filter(function(l){return l.stage==='won';}), lost=v.filter(function(l){return l.stage==='lost';});
  var active=v.filter(isActive);
  var closed=won.length+lost.length;
  var convRate=closed?Math.round(won.length/closed*100):0;
  var wonRev=won.reduce(function(s,l){return s+(Number(l.value)||0);},0);
  var avgJob=won.length?Math.round(wonRev/won.length):0;
  var pipeVal=active.reduce(function(s,l){return s+(Number(l.value)||0);},0);

  var ins='<div class="ins-grid">'+
    stat(I.spark,'Win rate',convRate+'%',closed?('of '+closed+' closed ('+won.length+' won · '+lost.length+' lost)'):'no closed leads yet')+
    stat(I.dollar,'Revenue won',money(wonRev),segLabel())+
    stat(I.check,'Avg job value',money(avgJob),won.length+' completed job'+(won.length===1?'':'s'))+
    stat(I.board,'Open pipeline',money(pipeVal),active.length+' active lead'+(active.length===1?'':'s'))+
  '</div>';

  // by lead quality (answers "do cold leads skew win rate?")
  var qBars=CONFIDENCE.map(function(c){
    var inTier=v.filter(function(l){return (l.confidence||'warm')===c.id;});
    var w=inTier.filter(function(l){return l.stage==='won';}).length;
    var ls=inTier.filter(function(l){return l.stage==='lost';}).length;
    var cl=w+ls, rate=cl?Math.round(w/cl*100):0;
    return {name:c.name,color:c.color,total:inTier.length,rate:rate,closed:cl};
  });
  var maxQ=Math.max.apply(null,qBars.map(function(q){return q.total;}).concat([1]));
  var qHtml=qBars.map(function(q){var w=Math.round(q.total/maxQ*100);return '<div class="bar-row"><div class="bar-label"><span class="sw" style="background:'+q.color+'"></span>'+q.name+'</div><div class="bar-track"><div class="bar-fill" style="width:'+w+'%;background:'+q.color+'"></div></div><div class="bar-val tnum">'+q.total+' lead'+(q.total===1?'':'s')+' <small>· '+(q.closed?q.rate+'% won':'none closed')+'</small></div></div>';}).join('');
  var qPanel='<div class="panel"><div class="panel-head"><h2>Win rate by lead quality</h2><span class="hint">Only closed leads (won + lost) count toward a rate</span></div><div class="bars">'+qHtml+'</div></div>';

  // by source
  var bySource={};
  v.forEach(function(l){ var s=l.source||'Other'; (bySource[s]=bySource[s]||{total:0,won:0,rev:0}); bySource[s].total++; if(l.stage==='won'){bySource[s].won++;bySource[s].rev+=Number(l.value)||0;} });
  var srcArr=Object.keys(bySource).map(function(k){return {name:k,d:bySource[k]};}).sort(function(a,b){return b.d.total-a.d.total;});
  var maxTotal=Math.max.apply(null,srcArr.map(function(s){return s.d.total;}).concat([1]));
  var srcBars=srcArr.map(function(s){
    var w=Math.round(s.d.total/maxTotal*100);
    var conv=s.d.total?Math.round(s.d.won/s.d.total*100):0;
    return '<div class="bar-row"><div class="bar-label">'+esc(s.name)+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+w+'%;background:var(--accent)"></div></div>'+
      '<div class="bar-val tnum">'+s.d.total+' lead'+(s.d.total===1?'':'s')+' <small>· '+conv+'% won</small></div></div>';
  }).join('');
  var srcPanel='<div class="panel"><div class="panel-head"><h2>Where your leads come from</h2><span class="hint">Volume &amp; win rate by source</span></div><div class="bars">'+srcBars+'</div></div>';

  // by service
  var bySvc={};
  v.forEach(function(l){ (l.services||[]).forEach(function(id){ bySvc[id]=(bySvc[id]||0)+1; }); });
  var svcArr=Object.keys(bySvc).map(function(k){return {id:k,n:bySvc[k]};}).sort(function(a,b){return b.n-a.n;});
  var svcPanel='';
  if(svcArr.length){
    var maxSvc=Math.max.apply(null,svcArr.map(function(s){return s.n;}).concat([1]));
    var svcBars=svcArr.map(function(s){var w=Math.round(s.n/maxSvc*100);return '<div class="bar-row"><div class="bar-label">'+esc(svcName(s.id))+'</div><div class="bar-track"><div class="bar-fill" style="width:'+w+'%;background:var(--res)"></div></div><div class="bar-val tnum">'+s.n+'</div></div>';}).join('');
    svcPanel='<div class="panel"><div class="panel-head"><h2>Most requested services</h2></div><div class="bars">'+svcBars+'</div></div>';
  }

  // funnel
  var funnel='<div class="panel"><div class="panel-head"><h2>Pipeline funnel</h2></div><div class="funnel">'+
    STAGES.map(function(s){var n=v.filter(function(l){return l.stage===s.id;}).length;return '<div class="fn-step"><div class="fn-n tnum">'+n+'</div><div class="fn-l"><span class="cdot" style="background:'+s.color+'"></span>'+s.name+'</div></div>';}).join('')+'</div></div>';

  return ins+qPanel+srcPanel+svcPanel+funnel;
}

/* ============================================================================ SLIDE-OVER */
function openLead(id){ state.selectedId=id; renderOverlay(); }
function closeOverlay(){ state.selectedId=null; state._modal=null; document.getElementById('overlay').innerHTML=''; restoreFocus(); }
function saveFocus(){ state._lastFocus=document.activeElement; }
function restoreFocus(){ try{ if(state._lastFocus&&state._lastFocus.focus) state._lastFocus.focus(); }catch(e){} }

function renderOverlay(){
  var ov=document.getElementById('overlay');
  if(state._modal){ ov.innerHTML='<div class="scrim" data-close="1"></div>'+state._modal(); wireModal(); return; }
  if(!state.selectedId){ ov.innerHTML=''; return; }

function slideover(lead){
  var fu=fuStatus(lead);
  var typeChip='<span class="chip '+(lead.type==='residential'?'chip-res':'chip-com')+'"><span class="dot" style="background:currentColor"></span>'+(lead.type==='residential'?'Residential':'Commercial')+'</span>';

  var confPick='<div class="conf-pick" style="margin-top:2px">'+CONFIDENCE.map(function(cc){return '<button type="button" class="conf-opt'+(lead.confidence===cc.id?' '+cc.cls:'')+'" data-setconf="'+cc.id+'"><span class="cdot" style="background:'+cc.color+'"></span>'+cc.name+'</button>';}).join('')+'</div>';
  var stageOpts=STAGES.map(function(s){return '<option value="'+s.id+'"'+(s.id===lead.stage?' selected':'')+'>'+s.name+'</option>';}).join('');

  var info='<div class="info-grid">';
  if(lead.contact) info+=infoItem(I.people,'Contact',esc(lead.contact));
  if(lead.phone)  info+=infoItem(I.phone,'Phone','<a class="it-val" href="tel:'+attr(lead.phone)+'">'+esc(lead.phone)+'</a>');
  if(lead.email)  info+=infoItem(I.mail,'Email','<a class="it-val" href="mailto:'+attr(lead.email)+'">'+esc(lead.email)+'</a>');
  if(lead.address)info+=infoItem(I.pin,'Address','<a class="it-val" href="https://maps.google.com/?q='+encodeURIComponent(lead.address)+'" target="_blank" rel="noopener">'+esc(lead.address)+'</a>',true);
  info+=infoItem(I.dollar,'Est. value',lead.value?money(lead.value):'—');
  info+=infoItem(I.board,'Source',esc(lead.source||'—'));
  if(lead.propertyType) info+=infoItem(I.building,'Property type',esc(lead.propertyType));
  info+='</div>';

  // services
  var svcSection='';
  if((lead.services||[]).length){
    svcSection='<div class="section"><div class="section-label">Services</div><div class="tag-pick">'+lead.services.map(function(id){return '<span class="chip chip-svc" style="padding:5px 11px;font-size:12px">'+esc(svcName(id))+'</span>';}).join('')+'</div></div>';
  }

  // follow-up
  var lvlCls={overdue:'bad',today:'warn',soon:'ok',later:'ok',none:'none'}[fu.level];
  var fuBlock;
  if(fu.level==='none'){
    fuBlock='<div class="fu-set none"><div class="fs-ic">'+I.bell+'</div><div class="fs-txt"><div class="t">No follow-up scheduled</div><div class="d">Set a date to get reminded to reach back out.</div></div><button class="btn btn-soft btn-sm" data-setfu="1">Set date</button></div>';
  } else {
    var lbl=fu.level==='overdue'?(Math.abs(fu.days)+' days overdue'):fu.level==='today'?'Due today':relDays(lead.followUp.date);
    fuBlock='<div class="fu-set '+lvlCls+'"><div class="fs-ic">'+I.bell+'</div><div class="fs-txt"><div class="t">Follow up '+esc(fmtDate(lead.followUp.date))+' · '+lbl+'</div>'+(lead.followUp.note?'<div class="d">'+esc(lead.followUp.note)+'</div>':'<div class="d">No note</div>')+'</div><button class="btn btn-ghost btn-sm" data-setfu="1">Edit</button></div>';
  }

  // re-clean (repeat business) — shown for won jobs
  var recleanBlock='';
  if(lead.stage==='won'){
    if(lead.reclean){
      recleanBlock='<div class="section"><div class="fu-set good"><div class="fs-ic">'+I.repeat+'</div><div class="fs-txt"><div class="t">Repeat customer — re-clean every '+lead.reclean+' months</div><div class="d">Next reminder set for '+esc(fmtDate((lead.followUp&&lead.followUp.date)||addMonthsISO(lead.reclean)))+'</div></div><button class="btn btn-ghost btn-sm" data-reclean="0">Stop</button></div></div>';
    } else {
      recleanBlock='<div class="section"><div class="section-label">Repeat business</div><div class="fu-set none"><div class="fs-ic">'+I.repeat+'</div><div class="fs-txt"><div class="t">Schedule the next re-clean</div><div class="d">Power washing wears off — line up the next job now.</div></div></div>'+

    }
  }

  // timeline
  var comms=(lead.comms||[]).slice().sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:(b.ts||0)-(a.ts||0));});
  var tl=comms.length?comms.map(function(c){var m=METHOD_MAP[c.method]||METHOD_MAP.note;return '<div class="tl-item"><div class="tl-ic '+m.cls+'">'+m.icon+'</div><div class="tl-body"><div class="tl-top"><span class="tl-method">'+m.name+(c.outcome&&OUTCOME_MAP[c.outcome]?' <span style="font-weight:500;color:var(--muted)">· '+esc(outcomeLabel(c.outcome,c.method))+'</span>':'')+'</span><span class="tl-date tnum">'+fmtDate(c.date)+'</span></div>'+(c.notes?'<div class="tl-notes">'+esc(c.notes)+'</div>':'<div class="tl-notes" style="color:var(--faint)">No notes</div>')+'<div class="tl-actions"><button class="tl-del" data-editcomm="'+c.id+'">Edit</button><button class="tl-del" data-delcomm="'+c.id+'">Delete</button></div></div></div>';}).join(''):'<div style="color:var(--faint);font-size:13.5px;padding:4px 0 10px">No communication logged yet. Every call, text, or email you log here builds this lead\'s history.</div>';

  var lostBlock=lead.stage==='lost'&&lead.lostReason?'<div class="section"><div class="fu-set bad"><div class="fs-ic">'+I.info+'</div><div class="fs-txt"><div class="t">Marked lost</div><div class="d">Reason: '+esc(lead.lostReason)+'</div></div></div></div>':'';

      '<div class="so-sub">'+typeChip+confChip+(lead.reclean?' <span class="chip chip-repeat">'+I.repeat+'Repeat</span>':'')+'<span>Added '+fmtDate(isoFromTs(lead.created))+'</span></div></div>'+
      '<button class="icon-btn" data-close="1" aria-label="Close">'+I.x+'</button></div>'+
      '<div style="margin-top:14px"><label class="field-lbl" for="stageSel" style="margin-bottom:6px">Pipeline stage</label>'+
      '<select id="stageSel" style="width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:9px 11px;background:var(--surface-2);color:var(--ink);font-weight:600">'+stageOpts+'</select></div></div>'+
    '<div class="so-body">'+
      '<div class="section">'+fuBlock+(fu.level!=='none'?'<div style="text-align:right;margin-top:8px"><button class="btn btn-ghost btn-sm" data-addcal="'+lead.id+'">'+I.calendar+'Add to my calendar</button></div>':'')+'</div>'+recleanBlock+lostBlock+

          (lead.email?'<button class="btn btn-soft btn-sm" data-compose="'+lead.id+'|email">'+I.mail+'Email</button>':'')+
          '<button class="btn btn-ghost btn-sm" data-compose="'+lead.id+'|copy">'+I.copy+'Compose message</button>'+
        '</div>'+((!lead.phone&&!lead.email)?'<div class="var-hint" style="margin-top:8px">Add a phone or email to send with one tap.</div>':'')+'</div>'+
      '<div class="section"><div class="section-label">Lead quality</div>'+confPick+'</div>'+
      '<div class="section"><div class="section-label">Contact info</div>'+info+'</div>'+svcSection+
      '<div class="section"><div class="section-label">Communication log<button class="add" data-log="'+lead.id+'">'+I.plus+'Log contact</button></div><div class="timeline">'+tl+'</div></div>'+
      '<div class="section"><div class="section-label">Notes<button class="add" data-editnote="'+lead.id+'">'+I.edit+'Edit</button></div><div class="notes-box'+(lead.notes?'':' empty-note')+'">'+(lead.notes?esc(lead.notes):'No notes yet')+'</div></div>'+
    '</div>'+
    '<div class="so-foot"><button class="btn btn-ghost btn-sm" data-edit="'+lead.id+'">'+I.edit+'Edit details</button><div style="flex:1"></div><button class="btn btn-danger btn-sm" data-del="'+lead.id+'">'+I.trash+'Delete</button></div>'+
  '</aside>';

function rebuildOutcomeOptions(){
  var sel=document.getElementById('c-outcome'); if(!sel) return;
  var method=document.getElementById('c-method').value, col=document.getElementById('c-outcome-col');
  var opts=outcomesFor(method);
  if(!opts.length){ if(col) col.style.display='none'; sel.value=''; recomputeFollowup(); return; }
  if(col) col.style.display='';
  var cur=sel.value, keep=opts.filter(function(o){return o.id===cur;}).length?cur:defaultOutcome(method);
  sel.innerHTML=opts.map(function(o){return '<option value="'+o.id+'"'+(o.id===keep?' selected':'')+'>'+esc(o.name)+'</option>';}).join('');
  recomputeFollowup();
}
function recomputeFollowup(){
  var lid=document.getElementById('c-leadid'); if(!lid) return;
  if(document.getElementById('c-editid')&&document.getElementById('c-editid').value) return; // edit mode: no suggestion
  if(settings.autoCadence===false) return;
  var lead=state.leads.find(function(l){return l.id===lid.value;}); if(!lead) return;
  var outcome=document.getElementById('c-outcome').value, method=document.getElementById('c-method').value;
  var setfu=document.getElementById('c-setfu'), wrap=document.getElementById('c-fu-wrap'), why=document.getElementById('c-fu-why');
  var o=OUTCOME_MAP[outcome];
  if(o&&o.lost){ if(setfu) setfu.checked=false; if(wrap) wrap.style.display='none'; if(why) why.innerHTML=I.info+'<span>This lead will be marked Lost — no follow-up needed.</span>'; return; }
  var sug=suggestNextStep(lead,outcome,method); if(!sug) return;
  if(setfu) setfu.checked=true; if(wrap) wrap.style.display='block';
  var d=document.getElementById('c-fudate'), n=document.getElementById('c-funote');
  if(d) d.value=sug.date; if(n) n.value=sug.note; if(why) why.innerHTML=I.spark+'<span>'+esc(sug.why)+'</span>';
}

function importMapModal(headers,rows){

    {k:'name',lbl:'Name / Business',req:true},{k:'contact',lbl:'Contact person'},{k:'phone',lbl:'Phone'},
    {k:'email',lbl:'Email'},{k:'address',lbl:'Address'},{k:'value',lbl:'Job value'},

        '<div class="field"><label>These leads are mostly…</label><div class="type-pick"><button type="button" class="type-opt sel-res" data-itype="residential" id="imp-res">'+I.home+'Residential</button><button type="button" class="type-opt" data-itype="commercial" id="imp-com">'+I.building+'Commercial</button></div><input type="hidden" id="imp-type" value="residential"/></div>'+
        '<div style="margin:6px 0 4px;font-size:12.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.03em">Match your columns</div>'+
        mapRows+
        '<div class="set-row" style="margin-top:14px;border-top:1px solid var(--line)"><div class="sr-txt"><div class="t">Skip duplicates</div><div class="d">Don\'t import a lead if the phone or email already exists.</div></div><label class="switch"><input type="checkbox" id="imp-dedupe" checked/><span class="track"></span></label></div>'+
      '</div>'+
      '<div class="modal-foot"><button class="btn btn-ghost" data-close="1">Cancel</button><div class="spacer"></div><button class="btn btn-primary" id="imp-run">'+I.check+'Import '+rows.length+'</button></div></div>';
  };
}
function autoMap(headers){
  var m={name:'',contact:'',phone:'',email:'',address:'',value:'',source:'',notes:'',_firstIdx:-1,_lastIdx:-1};
  var syn={
    name:['full name','fullname','name','client name','contact name','company','business name','company name','account name','customer','customer name','lead name'],
    contact:['contact person','point of contact','contact','primary contact','attn'],
    phone:['phone','phone number','phone_number','mobile','cell','telephone','client phone number','contact phone','primary phone','phone 1'],
    email:['email','e-mail','email address','email_address','client email address','contact email','primary email'],
    address:['address','street address','street','service address','location','address 1','full address','job street address','mailing address'],
    value:['value','amount','price','estimate','job value','deal value','opportunity value','monetary value','sold amount','job total','quote','total'],
    source:['source','lead source','ad source','utm_source','job source','channel','origin','referral source'],
    notes:['notes','note','description','comments','comment','message','details','remarks']
  };
  var lower=headers.map(function(h){return String(h||'').trim().toLowerCase();});
  function findIdx(list){ for(var i=0;i<lower.length;i++){ if(list.indexOf(lower[i])>=0) return i; } for(var j=0;j<lower.length;j++){ for(var k=0;k<list.length;k++){ if(lower[j].indexOf(list[k])>=0) return j; } } return -1; }
  Object.keys(syn).forEach(function(f){ var idx=findIdx(syn[f]); if(idx>=0) m[f]=idx; });
  // first/last combine
  var fi=lower.indexOf('first name'); if(fi<0)fi=lower.indexOf('first'); if(fi<0)fi=lower.indexOf('firstname');
  var li=lower.indexOf('last name'); if(li<0)li=lower.indexOf('last'); if(li<0)li=lower.indexOf('lastname');
  m._firstIdx=fi; m._lastIdx=li;
  if((m.name===''||m.name==null) && fi>=0 && li>=0) m.name='__FL__';
  return m;
}

function wire(){
  var app=document.getElementById('app');
  app.onclick=function(e){
    var t=e.target.closest('[data-nav],[data-seg],[data-act],[data-open],[data-log],[data-snooze],[data-sort],[data-add-stage]');
    if(!t) return;
    if(t.dataset.nav){ state.view=t.dataset.nav; state.sidebarOpen=false; render(); return; }
    if(t.dataset.seg){ state.segment=t.dataset.seg; render(); return; }
    if(t.dataset.sort){ toggleSort(t.dataset.sort); return; }
    if(t.dataset.addStage){ openModal(leadModal(null,t.dataset.addStage)); return; }
    if(t.dataset.snooze){ e.stopPropagation(); snooze(t.dataset.snooze); return; }
    if(t.dataset.log){ e.stopPropagation(); openModal(commModal(t.dataset.log)); return; }
    if(t.dataset.open){ openLead(t.dataset.open); return; }
    doAction(t.dataset.act);
  };
  var s=document.getElementById('search'); if(s) s.oninput=function(){ state.search=this.value; refreshContent(); };
  bindFilters();
  if(state.view==='pipeline') setupDnD();

  var sf=document.getElementById('svcFilter'); if(sf) sf.onchange=function(){ state.serviceFilter=this.value; refreshContent(); };

function doAction(act){
  if(act==='add') openModal(leadModal(null));

  else if(act==='theme') toggleTheme();
  else if(act==='export') exportData();

function trapFocus(container){
  if(!container) return;
  container.addEventListener('keydown',function(e){
    if(e.key!=='Tab') return;
    var f=container.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])');
    if(!f.length) return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  });
}

    openModal(confirmModal('Import '+data.leads.length+' leads?','This replaces your current '+state.leads.length+' lead'+(state.leads.length===1?'':'s')+' with the '+data.leads.length+' from this backup file. Export first if unsure.','Replace & import',function(){ state.leads=data.leads.map(normalizeLead); save(); closeOverlay(); render(); toast('Imported '+state.leads.length+' leads'); },false));
  }catch(e){ toast('Not a valid backup file',true); }

function parseCSV(text){
  var rows=[],row=[],cur='',i=0,inQ=false,c;
  text=text.replace(/^﻿/,'');
  while(i<text.length){ c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i+=2;continue;} inQ=false;i++;continue;} cur+=c;i++;continue; }
    if(c==='"'){ inQ=true;i++;continue; }
    if(c===','){ row.push(cur);cur='';i++;continue; }
    if(c==='\r'){ i++;continue; }
    if(c==='\n'){ row.push(cur);rows.push(row);row=[];cur='';i++;continue; }
    cur+=c;i++;
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(x){return String(x).trim()!=='';}); });
}
function importCSV(text){
  var rows=parseCSV(text);
  if(rows.length<2){ toast('CSV has no data rows',true); return; }
  var headers=rows[0].map(function(h){return String(h).trim();});
  var body=rows.slice(1);
  state._importRows=body; state._importHeaders=headers;
  openModal(importMapModal(headers,body));
